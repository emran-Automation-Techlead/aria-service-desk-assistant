<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA — Internal Knowledge Assistant</title>
<style>
  :root {
    --bg: #0f172a; --panel: #16213a; --panel2: #1e293b; --border: #263449;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #3b82f6; --accent2: #22c55e;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 1.3em; margin: 0; color: #60a5fa; }
  header p { margin: 0; color: var(--muted); font-size: 0.85em; }
  .layout { flex: 1; display: flex; overflow: hidden; }
  .sidebar {
    width: 220px; border-right: 1px solid var(--border); padding: 16px; overflow-y: auto;
  }
  .sidebar label { font-size: 0.75em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .team-btn {
    display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 6px 0;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    cursor: pointer; font-size: 0.9em;
  }
  .team-btn.active { border-color: var(--accent); background: #1d3a63; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 70%; padding: 12px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.assistant.clarifying { border-color: #f59e0b55; }
  .msg.assistant.blocked { border-color: #ef444455; background: #2a1414; }
  .msg .src { display: block; margin-top: 8px; font-size: 0.75em; color: var(--muted); }
  .msg .src a { color: #60a5fa; }
  .msg .src .badge {
    display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--panel2);
    border: 1px solid var(--border); margin-right: 6px; font-size: 0.9em;
  }

  /* status bubble while ARIA is probing/searching/drafting */
  .msg.status { color: var(--muted); font-style: italic; }
  .msg.status .dots span {
    display: inline-block; width: 5px; height: 5px; margin-left: 2px; border-radius: 50%;
    background: var(--muted); animation: pulse-dot 1.1s infinite ease-in-out;
  }
  .msg.status .dots span:nth-child(2) { animation-delay: 0.15s; }
  .msg.status .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse-dot { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  /* blinking cursor at the tail of a streaming reply, mimicking a live typed response */
  .cursor {
    display: inline-block; width: 7px; height: 1em; margin-left: 1px; vertical-align: text-bottom;
    background: currentColor; animation: blink-cursor 0.9s steps(1) infinite;
  }
  @keyframes blink-cursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .redaction-note { align-self: flex-start; font-size: 0.75em; color: var(--warn); }
  .composer { border-top: 1px solid var(--border); padding: 14px 24px; display: flex; gap: 10px; }
  .composer textarea {
    flex: 1; resize: none; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font-size: 0.9em; font-family: inherit; height: 44px;
  }
  .composer button {
    padding: 0 18px; border: none; border-radius: 8px; background: var(--accent); color: white;
    cursor: pointer; font-weight: 600;
  }
  .composer button.ticket { background: var(--warn); }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }
  .ticket-result {
    margin: 0 24px 14px; padding: 12px 14px; background: #14251a; border: 1px solid #22c55e55;
    border-radius: 8px; font-size: 0.85em;
  }
</style>
</head>
<body>

<header>
  <h1>ARIA</h1>
  <p>Internal knowledge assistant — Service Desk · Command Center · Network · Linux · Database · Windows Engineering</p>
</header>

<div class="layout">
  <div class="sidebar">
    <label>Team</label>
    <div id="teamList"></div>
  </div>

  <div class="main">
    <div class="messages" id="messages"></div>
    <div id="ticketResult"></div>
    <div class="composer">
      <textarea id="input" placeholder="Ask ARIA a question, or describe an issue..."></textarea>
      <button id="sendBtn">Ask</button>
      <button id="ticketBtn" class="ticket">Log as Ticket</button>
    </div>
  </div>
</div>

<script>
let teams = [];
let currentTeam = null;
let history = [];

// Rotates while ARIA is working and no status word has come back from the
// server yet -- purely cosmetic, replaced the instant a real status arrives.
const MUSING_WORDS = ['Musing', 'Pondering', 'Percolating', 'Sautéing the details', 'Mulling it over', 'Connecting the dots'];

const STATUS_LABELS = {
  probing: 'Reading the question',
  asking: 'Following up',
  searching: 'Searching the knowledge base',
  answering: (e) => `Reading “${e.article_title}”`,
  drafting: 'Nothing on file — drafting a new article',
  writing_article: (e) => `Writing “${e.article_title}”`,
  blocked: 'Checking message safety',
};

async function loadTeams() {
  const res = await fetch('/api/teams');
  teams = await res.json();
  const list = document.getElementById('teamList');
  teams.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'team-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => selectTeam(t.id, btn);
    list.appendChild(btn);
  });
  currentTeam = teams[0].id;
}

function selectTeam(id, btn) {
  currentTeam = id;
  document.querySelectorAll('.team-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  history = [];
  document.getElementById('messages').innerHTML = '';
  document.getElementById('ticketResult').innerHTML = '';
}

function scrollToBottom() {
  const messages = document.getElementById('messages');
  messages.scrollTop = messages.scrollHeight;
}

function appendUserMessage(content) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = content;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
}

function appendStatusBubble(label) {
  const div = document.createElement('div');
  div.className = 'msg assistant status';
  div.innerHTML = `<span class="label">${label}</span><span class="dots"><span></span><span></span><span></span></span>`;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
  return div;
}

function sourceFooterHtml(event) {
  if (event.source === 'clarifying_question') return '';
  if (event.source === 'drafted_article') {
    return `<span class="badge">📝 auto-drafted</span>Published a new article: <a href="${event.article_url}" target="_blank">${event.article_title}</a>`;
  }
  if (event.article_title) {
    const badge = event.doc_type ? `<span class="badge">${event.doc_type}</span>` : '';
    const conf = (typeof event.confidence === 'number') ? ` · ${Math.round(event.confidence * 100)}% match` : '';
    return `${badge}Source: <a href="${event.article_url}" target="_blank">${event.article_title}</a>${conf}`;
  }
  return '';
}

async function sendMessage() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  appendUserMessage(text);
  const requestHistory = history.slice();
  history.push({ role: 'user', content: text });

  document.getElementById('sendBtn').disabled = true;

  let musingIdx = 0;
  const statusBubble = appendStatusBubble(MUSING_WORDS[0]);
  const musingTimer = setInterval(() => {
    musingIdx = (musingIdx + 1) % MUSING_WORDS.length;
    const label = statusBubble.querySelector('.label');
    if (label) label.textContent = MUSING_WORDS[musingIdx];
  }, 900);

  let messageDiv = null;
  let cursorSpan = null;
  let fullText = '';
  let lastEvent = null;

  function switchToStreamingBubble(extraClass) {
    clearInterval(musingTimer);
    statusBubble.remove();
    messageDiv = document.createElement('div');
    messageDiv.className = 'msg assistant' + (extraClass ? ` ${extraClass}` : '');
    const textSpan = document.createElement('span');
    textSpan.className = 'text';
    cursorSpan = document.createElement('span');
    cursorSpan.className = 'cursor';
    messageDiv.appendChild(textSpan);
    messageDiv.appendChild(cursorSpan);
    document.getElementById('messages').appendChild(messageDiv);
  }

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ team: currentTeam, message: text, history: requestHistory })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const event = JSON.parse(part.slice(6));

        if (event.type === 'status') {
          if (!messageDiv) {
            const labelFn = STATUS_LABELS[event.value];
            const label = typeof labelFn === 'function' ? labelFn(event) : (labelFn || event.value);
            clearInterval(musingTimer);
            const lbl = statusBubble.querySelector('.label');
            if (lbl) lbl.textContent = label;
          }
        } else if (event.type === 'delta') {
          if (!messageDiv) switchToStreamingBubble(null);
          fullText += event.value;
          messageDiv.querySelector('.text').textContent = fullText;
          scrollToBottom();
        } else if (event.type === 'done') {
          lastEvent = event;
          if (!messageDiv) {
            const cls = event.source === 'clarifying_question' ? 'clarifying' : (event.source === 'blocked' ? 'blocked' : null);
            switchToStreamingBubble(cls);
          }
          if (cursorSpan) cursorSpan.remove();
          const footer = sourceFooterHtml(event);
          if (footer) {
            const src = document.createElement('span');
            src.className = 'src';
            src.innerHTML = footer;
            messageDiv.appendChild(src);
          }
        }
      }
    }

    history.push({ role: 'assistant', content: fullText });
    scrollToBottom();
  } catch (e) {
    clearInterval(musingTimer);
    statusBubble.remove();
    appendStatusBubble('Something went wrong reaching ARIA: ' + e);
  } finally {
    clearInterval(musingTimer);
    document.getElementById('sendBtn').disabled = false;
  }
}

async function logTicket() {
  if (history.length === 0) {
    document.getElementById('ticketResult').innerHTML =
      '<div class="ticket-result">Chat with ARIA first, then log it as a ticket.</div>';
    return;
  }
  document.getElementById('ticketBtn').disabled = true;
  try {
    const res = await fetch('/api/ticket', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ team: currentTeam, history })
    });
    const data = await res.json();
    document.getElementById('ticketResult').innerHTML = `
      <div class="ticket-result">
        ✅ Filed <strong>${data.ticket_key}</strong> (${data.priority}) —
        <a href="${data.ticket_url}" target="_blank">${data.ticket_url}</a><br>
        <em>${data.summary}</em>
      </div>`;
  } catch (e) {
    document.getElementById('ticketResult').innerHTML = '<div class="ticket-result">Failed to log ticket: ' + e + '</div>';
  } finally {
    document.getElementById('ticketBtn').disabled = false;
  }
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('ticketBtn').onclick = logTicket;
document.getElementById('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

loadTeams();
</script>

</body>
</html>
